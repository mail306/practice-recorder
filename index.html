<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プレゼン練習 — 録音 & 文字起こし</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cormorant Garamond', serif;
    background: #f5f0eb;
    color: #2c2420;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  h1 {
    font-weight: 300;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 300;
    opacity: 0.4;
    letter-spacing: 0.15em;
    margin-bottom: 2rem;
  }

  .timer-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .timer {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .timer.warning { color: #b85c3c; }
  .timer.overtime { color: #c43030; }

  .timer-bar {
    width: 320px;
    height: 3px;
    background: rgba(44, 36, 32, 0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .timer-bar-fill {
    height: 100%;
    background: #8b6f5c;
    border-radius: 2px;
    transition: width 1s linear, background-color 0.5s;
    width: 0%;
  }

  .timer-bar-fill.warning { background: #b85c3c; }
  .timer-bar-fill.overtime { background: #c43030; }

  .target-time {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 300;
    opacity: 0.4;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .target-time input {
    width: 3rem;
    background: transparent;
    border: none;
    border-bottom: 1px solid currentColor;
    color: inherit;
    font-family: inherit;
    font-size: inherit;
    text-align: center;
    outline: none;
  }

  .target-time input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .controls {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    padding: 0.7rem 2rem;
    cursor: pointer;
    transition: all 0.3s ease;
    opacity: 0.7;
  }

  .btn:hover { opacity: 1; }
  .btn.primary { opacity: 1; background: #2c2420; color: #f5f0eb; border-color: #2c2420; }
  .btn.recording { background: #c43030; color: #f5f0eb; border-color: #c43030; opacity: 1; }
  .btn:disabled { opacity: 0.3; cursor: default; }
  .btn:active { transform: scale(0.97); }

  .status {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 300;
    opacity: 0.5;
    letter-spacing: 0.15em;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .status .rec-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c43030;
    animation: blink 1s ease-in-out infinite;
    display: none;
  }

  .status.active .rec-dot { display: block; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .transcript-section {
    width: 100%;
    max-width: 640px;
    margin-bottom: 2rem;
  }

  .transcript-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }

  .transcript-title {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    opacity: 0.5;
  }

  .transcript-box {
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(44,36,32,0.1);
    border-radius: 4px;
    padding: 1.2rem;
    min-height: 200px;
    max-height: 400px;
    overflow-y: auto;
    font-size: 0.95rem;
    line-height: 1.8;
  }

  .transcript-line {
    margin-bottom: 0.4rem;
    display: flex;
    gap: 0.8rem;
  }

  .transcript-line .ts {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    font-weight: 400;
    color: #8b6f5c;
    white-space: nowrap;
    min-width: 3.5rem;
    padding-top: 0.15rem;
  }

  .transcript-line .text {
    flex: 1;
  }

  .transcript-line.interim .text {
    opacity: 0.4;
    font-style: italic;
  }

  .audio-section {
    width: 100%;
    max-width: 640px;
    margin-bottom: 1.5rem;
    display: none;
  }

  .audio-section audio {
    width: 100%;
    margin-top: 0.5rem;
  }

  .copy-section {
    width: 100%;
    max-width: 640px;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .copy-section .btn { font-size: 0.7rem; padding: 0.5rem 1.2rem; }

  .copied-msg {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    opacity: 0;
    transition: opacity 0.3s;
    color: #8b6f5c;
    display: flex;
    align-items: center;
  }

  .copied-msg.show { opacity: 1; }
</style>
</head>
<body>

<h1>プレゼン練習</h1>
<div class="subtitle">recording & transcript</div>

<div class="timer-section">
  <div class="timer" id="timer">00:00</div>
  <div class="timer-bar"><div class="timer-bar-fill" id="timerBarFill"></div></div>
  <div class="target-time">
    target: <input type="number" id="targetMin" value="10" min="1" max="60"> min
  </div>
</div>

<div class="status" id="status">
  <span class="rec-dot"></span>
  <span id="statusText">準備完了</span>
</div>

<div class="controls">
  <button class="btn primary" id="startBtn" onclick="startRecording()">start</button>
  <button class="btn" id="pauseBtn" onclick="togglePause()" disabled>pause</button>
  <button class="btn" id="stopBtn" onclick="stopRecording()" disabled>stop</button>
  <button class="btn" id="resetBtn" onclick="resetAll()">reset</button>
</div>

<div class="audio-section" id="audioSection">
  <div class="transcript-title">recording</div>
  <audio id="audioPlayer" controls></audio>
</div>

<div class="transcript-section">
  <div class="transcript-header">
    <div class="transcript-title">transcript</div>
  </div>
  <div class="transcript-box" id="transcriptBox">
    <div style="opacity:0.3; font-style:italic; font-size:0.85rem;">startを押すと録音と文字起こしが始まります</div>
  </div>
</div>

<div class="copy-section">
  <button class="btn" onclick="copyTranscript()">copy transcript</button>
  <button class="btn" onclick="copyForClaude()">copy for Claude review</button>
  <button class="btn" onclick="downloadTranscript()">download .txt</button>
  <button class="btn" id="downloadAudioBtn" onclick="downloadAudio()" disabled>download audio</button>
  <span class="copied-msg" id="copiedMsg">✓ copied</span>
</div>

<script>
// --- State ---
let isRecording = false;
let isPaused = false;
let startTime = null;
let elapsedBeforePause = 0;
let timerInterval = null;
let mediaRecorder = null;
let audioChunks = [];
let recognition = null;
let transcriptLines = []; // {time: "01:23", text: "..."}
let interimLine = null;
let targetMinutes = 10;

const timerEl = document.getElementById('timer');
const timerBarFill = document.getElementById('timerBarFill');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const pauseBtn = document.getElementById('pauseBtn');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const transcriptBox = document.getElementById('transcriptBox');
const audioSection = document.getElementById('audioSection');
const audioPlayer = document.getElementById('audioPlayer');

// --- Timer ---
function updateTimer() {
  if (!startTime || isPaused) return;
  const elapsed = elapsedBeforePause + Math.floor((Date.now() - startTime) / 1000);
  const min = Math.floor(elapsed / 60);
  const sec = elapsed % 60;
  timerEl.textContent = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;

  targetMinutes = parseInt(document.getElementById('targetMin').value) || 10;
  const targetSec = targetMinutes * 60;
  const progress = Math.min(100, (elapsed / targetSec) * 100);
  timerBarFill.style.width = progress + '%';

  if (elapsed >= targetSec) {
    timerEl.classList.add('overtime');
    timerEl.classList.remove('warning');
    timerBarFill.classList.add('overtime');
    timerBarFill.classList.remove('warning');
  } else if (elapsed >= targetSec * 0.8) {
    timerEl.classList.add('warning');
    timerEl.classList.remove('overtime');
    timerBarFill.classList.add('warning');
    timerBarFill.classList.remove('overtime');
  } else {
    timerEl.classList.remove('warning', 'overtime');
    timerBarFill.classList.remove('warning', 'overtime');
  }
}

function getTimestamp() {
  if (!startTime) return '00:00';
  let elapsed;
  if (isPaused) {
    elapsed = elapsedBeforePause;
  } else {
    elapsed = elapsedBeforePause + Math.floor((Date.now() - startTime) / 1000);
  }
  const min = Math.floor(elapsed / 60);
  const sec = elapsed % 60;
  return `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
}

// --- Recording ---
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    // MediaRecorder for audio file
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      audioPlayer.src = url;
      audioSection.style.display = 'block';
      document.getElementById('downloadAudioBtn').disabled = false;
    };
    mediaRecorder.start();

    // Speech recognition
    startSpeechRecognition();

    // Timer
    startTime = Date.now();
    elapsedBeforePause = 0;
    isPaused = false;
    timerInterval = setInterval(updateTimer, 1000);

    // UI
    isRecording = true;
    transcriptLines = [];
    transcriptBox.innerHTML = '';
    startBtn.disabled = true;
    startBtn.classList.remove('primary');
    pauseBtn.disabled = false;
    stopBtn.disabled = false;
    stopBtn.classList.add('recording');
    statusEl.classList.add('active');
    statusText.textContent = '録音中...';

  } catch (err) {
    alert('マイクへのアクセスを許可してください。\n' + err.message);
  }
}

function togglePause() {
  if (!isRecording) return;

  if (isPaused) {
    // Resume
    isPaused = false;
    startTime = Date.now();
    mediaRecorder.resume();
    startSpeechRecognition();
    timerInterval = setInterval(updateTimer, 1000);

    pauseBtn.textContent = 'pause';
    statusEl.classList.add('active');
    statusText.textContent = '録音中...';

    // Add pause marker to transcript
    transcriptLines.push({ time: getTimestamp(), text: '── 再開 ──' });
    renderTranscript();
  } else {
    // Pause
    elapsedBeforePause += Math.floor((Date.now() - startTime) / 1000);
    isPaused = true;
    clearInterval(timerInterval);
    mediaRecorder.pause();
    if (recognition) { recognition.stop(); recognition = null; }

    pauseBtn.textContent = 'resume';
    statusEl.classList.remove('active');
    statusText.textContent = '一時停止中';

    // Add pause marker to transcript
    transcriptLines.push({ time: getTimestamp(), text: '── 一時停止 ──' });
    renderTranscript();
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }

  if (recognition) {
    recognition.stop();
    recognition = null;
  }

  clearInterval(timerInterval);

  const totalElapsed = isPaused
    ? elapsedBeforePause
    : elapsedBeforePause + Math.floor((Date.now() - startTime) / 1000);

  isRecording = false;
  isPaused = false;
  startBtn.disabled = false;
  startBtn.classList.add('primary');
  pauseBtn.disabled = true;
  pauseBtn.textContent = 'pause';
  stopBtn.disabled = true;
  stopBtn.classList.remove('recording');
  statusEl.classList.remove('active');

  const min = Math.floor(totalElapsed / 60);
  const sec = totalElapsed % 60;
  statusText.textContent = `完了 — ${min}分${sec}秒`;

  // Remove interim line
  interimLine = null;
  renderTranscript();
}

function resetAll() {
  if (isRecording) stopRecording();

  startTime = null;
  elapsedBeforePause = 0;
  isPaused = false;
  timerEl.textContent = '00:00';
  timerEl.classList.remove('warning', 'overtime');
  timerBarFill.style.width = '0%';
  timerBarFill.classList.remove('warning', 'overtime');
  transcriptLines = [];
  transcriptBox.innerHTML = '<div style="opacity:0.3; font-style:italic; font-size:0.85rem;">startを押すと録音と文字起こしが始まります</div>';
  audioSection.style.display = 'none';
  statusText.textContent = '準備完了';
  startBtn.disabled = false;
  startBtn.classList.add('primary');
  pauseBtn.disabled = true;
  pauseBtn.textContent = 'pause';
}

// --- Speech Recognition ---
function startSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    statusText.textContent = '録音中（文字起こし非対応ブラウザ）';
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  let currentTimestamp = '00:00';

  recognition.onresult = (event) => {
    let interimText = '';
    let finalText = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (result.isFinal) {
        finalText += result[0].transcript;
      } else {
        interimText += result[0].transcript;
      }
    }

    if (finalText) {
      transcriptLines.push({
        time: currentTimestamp,
        text: finalText.trim()
      });
      // Set new timestamp for next segment
      currentTimestamp = getTimestamp();
      interimLine = null;
    }

    if (interimText) {
      if (!interimLine) {
        currentTimestamp = getTimestamp();
      }
      interimLine = {
        time: currentTimestamp,
        text: interimText.trim()
      };
    } else {
      interimLine = null;
    }

    renderTranscript();
  };

  recognition.onerror = (event) => {
    if (event.error === 'no-speech') return; // ignore
    console.log('Speech recognition error:', event.error);
  };

  recognition.onend = () => {
    // Auto-restart if still recording
    if (isRecording && recognition) {
      try { recognition.start(); } catch(e) {}
    }
  };

  recognition.start();
}

// --- Render ---
function renderTranscript() {
  let html = '';

  transcriptLines.forEach(line => {
    html += `<div class="transcript-line">
      <span class="ts">${line.time}</span>
      <span class="text">${escapeHtml(line.text)}</span>
    </div>`;
  });

  if (interimLine) {
    html += `<div class="transcript-line interim">
      <span class="ts">${interimLine.time}</span>
      <span class="text">${escapeHtml(interimLine.text)}</span>
    </div>`;
  }

  transcriptBox.innerHTML = html;
  transcriptBox.scrollTop = transcriptBox.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// --- Copy & Download ---
function getTranscriptText() {
  return transcriptLines.map(l => `[${l.time}] ${l.text}`).join('\n');
}

function copyTranscript() {
  const text = getTranscriptText();
  navigator.clipboard.writeText(text).then(() => showCopied());
}

function copyForClaude() {
  let elapsed;
  if (isRecording && !isPaused) {
    elapsed = elapsedBeforePause + Math.floor((Date.now() - startTime) / 1000);
  } else {
    elapsed = elapsedBeforePause;
  }
  const min = Math.floor(elapsed / 60);
  const sec = elapsed % 60;
  const target = document.getElementById('targetMin').value;

  let text = `# TAAP プレゼン練習レビュー依頼\n\n`;
  text += `- 目標時間: ${target}分\n`;
  text += `- 実際の時間: ${min}分${sec}秒\n\n`;
  text += `## 文字起こし（タイムスタンプ付き）\n\n`;
  text += getTranscriptText();
  text += `\n\n## レビューしてほしいポイント\n`;
  text += `- 10分に収まっているか\n`;
  text += `- 冒頭表明（スライドを離れる部分）の長さは適切か\n`;
  text += `- 「間抜け」（隙間）は感じられるか\n`;
  text += `- p.13の胞膜シリーズと冒頭の整合性は取れているか\n`;
  text += `- 削るべき箇所はどこか\n`;

  navigator.clipboard.writeText(text).then(() => showCopied());
}

function downloadTranscript() {
  const text = getTranscriptText();
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const now = new Date();
  a.download = `practice_${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadAudio() {
  if (audioChunks.length === 0) return;
  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const now = new Date();
  a.download = `practice_${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}.webm`;
  a.click();
  URL.revokeObjectURL(url);
}

function showCopied() {
  const msg = document.getElementById('copiedMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
}
</script>
</body>
</html>
